<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The motion layer of a talk clip, rendered by HyperFrames. talk_clip.py
     fills PLAN and copies camera.mp4, the fonts, emoji and generated images
     beside it. Layers, back to front: the camera (lens > pulse > shake >
     video), tone, grade, embers, light leak, cutaways, flash, stickers, then
     the words. Each GSAP property belongs to one layer. -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Montserrat"; src: url("Montserrat-Italic.ttf") format("truetype"); font-weight: 100 900; font-style: italic; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #05071e; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #05071e; }
.layer { position: absolute; inset: 0; }
#lens, #pulse, #shake { transform-origin: 50% 36%; }
#cam { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
#tone { opacity: 0; background: #704a1c; mix-blend-mode: color; }
#tone::after { content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 60% at 50% 45%, rgba(0,0,0,0) 40%, rgba(20,10,0,.7) 100%); }
#grade { pointer-events: none;
  background: radial-gradient(ellipse 78% 62% at 50% 40%, rgba(5,7,30,0) 52%, rgba(5,7,30,.62) 100%); }
#embers { mix-blend-mode: screen; }
#leak { inset: -25%; opacity: 0; mix-blend-mode: screen;
  background:
    radial-gradient(circle at 18% 28%, rgba(255,158,44,.9), rgba(255,158,44,0) 42%),
    radial-gradient(circle at 88% 72%, rgba(30,43,230,.75), rgba(30,43,230,0) 46%),
    radial-gradient(circle at 60% 10%, rgba(249,200,53,.55), rgba(249,200,53,0) 35%); }
.cut { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
.cut img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cut::after { content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 65% at 50% 45%, rgba(5,7,30,0) 55%, rgba(5,7,30,.55) 100%); }
#flash { background: #fff; opacity: 0; }
.stk { position: absolute; width: 320px; height: 320px; object-fit: contain; opacity: 0;
  filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)); }

/* Words: Montserrat Black Italic in capitals, a light top-to-bottom gradient,
   a soft shadow under each line; key words larger, yellow and glowing.
   .w carries the motion, .g the glow, .t the gradient fill. */
.w { display: inline-block; white-space: nowrap; }
.t { display: inline-block; font: italic 900 92px/1.02 Montserrat, sans-serif; text-transform: uppercase; letter-spacing: -0.01em;
  background: linear-gradient(180deg, #ffffff 0%, #ffffff 45%, #d7d9e6 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 6px; }
.hot .t { font-size: 120px; background: linear-gradient(180deg, #fff6b0 0%, #f9d84a 40%, #f9c835 70%, #d9a300 100%);
  -webkit-background-clip: text; background-clip: text; }
.hot .g { filter: drop-shadow(0 0 22px rgba(249,200,53,.55)); }
.cap, .hl { filter: drop-shadow(0 5px 0 rgba(5,7,30,.55)) drop-shadow(0 12px 22px rgba(0,0,0,.6)); }
.cap { position: absolute; left: 70px; right: 70px; top: 1030px; height: 260px; opacity: 0; text-align: center;
  display: flex; flex-wrap: wrap; justify-content: center; align-content: center; column-gap: 14px; row-gap: 0; }
#hook { position: absolute; left: 60px; right: 60px; top: 840px; height: 460px; }
/* End card: the brand's animated field (the talk videos' title card), a like button that gets pressed,
   the call to action in the caption lettering, and the logo small at the bottom. The thumb is Material
   Symbols' thumb_up (Apache-2.0), drawn the way YouTube's like button looks. */
#end { opacity: 0; }
#endfield { position: absolute; inset: 0; width: 1080px; height: 1920px; image-rendering: pixelated; }
#like { position: absolute; left: 390px; top: 560px; width: 300px; height: 170px; border-radius: 85px; background: #f2f2f2;
  box-shadow: 0 20px 40px rgba(0,0,0,.35); opacity: 0; }
#like svg.th { position: absolute; left: 95px; top: 30px; width: 110px; height: 110px; }
#like .burst { position: absolute; left: -60px; top: -60px; width: 420px; height: 290px; opacity: 0; }
#cta { position: absolute; left: 0; right: 0; top: 860px; text-align: center;
  filter: drop-shadow(0 5px 0 rgba(5,7,30,.55)) drop-shadow(0 12px 22px rgba(0,0,0,.6)); }
#cta .w { display: block; }
#cta .t { font-size: 112px; }
#cta .hot .t { font-size: 150px; }
#lock { position: absolute; left: 0; right: 0; top: 1500px; display: flex; justify-content: center; align-items: center; gap: 20px; opacity: 0; }
#lock .m { height: 64px; } #lock .wm { height: 38px; }
.pg { position: absolute; inset: 0; opacity: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.hl { display: flex; flex-wrap: wrap; column-gap: 16px; justify-content: center; text-align: center; }
.hl .t { font-size: 96px; }
.hl.hot .t { font-size: 150px; }
</style>
</head>
<body>
<div id="root" data-composition-id="short" data-width="1080" data-height="1920" data-start="0" data-duration="__DUR__">
  <div id="lens" class="layer"><div id="pulse" class="layer"><div id="shake" class="layer">
    <video id="cam" class="clip" src="camera.mp4" muted playsinline data-start="0" data-duration="__CAM__" data-track-index="0"></video>
  </div></div></div>
  <div id="tone" class="layer"></div>
  <div id="grade" class="layer"></div>
  <canvas id="embers" class="layer" width="1080" height="1920"></canvas>
  <div id="leak" class="layer"></div>
  <div id="cuts" class="layer"></div>
  <div id="flash" class="layer"></div>
  <div id="stickers" class="layer"></div>
  <div id="hook"></div>
  <div id="caps" class="layer"></div>
  <div id="end" class="layer">
    <canvas id="endfield" width="540" height="960"></canvas>
    <div id="like">
      <svg class="burst" viewBox="0 0 420 290"><g stroke="#f9c835" stroke-width="10" stroke-linecap="round">
        <line x1="210" y1="18" x2="210" y2="48"/><line x1="120" y1="40" x2="138" y2="64"/><line x1="300" y1="40" x2="282" y2="64"/>
        <line x1="70" y1="120" x2="100" y2="128"/><line x1="350" y1="120" x2="320" y2="128"/></g></svg>
      <svg class="th" id="thumbOut" viewBox="0 -960 960 960"><path fill="#0f0f0f" d="M855-632q24 0 42 18t18 42v81.84q0 7.16 1.5 14.66T915-461L789-171q-8.88 21.25-29.59 36.12Q738.69-120 716-120H272v-512l225-238q13.6-14 32.19-16.5Q547.77-889 565-879q17 10 25.5 27.5t4.2 36.5L556-632h299Zm-523 25v427h397l126-299v-93H482l53-249-203 214ZM139-120q-24.75 0-42.37-17.63Q79-155.25 79-180v-392q0-24.75 17.63-42.38Q114.25-632 139-632h133v60H139v392h133v60H139Zm193-60v-427 427Z"/></svg>
      <svg class="th" id="thumbFill" viewBox="0 -960 960 960" style="opacity:0"><path fill="#0f0f0f" d="M860-632q23 0 41.5 18.5T920-572v82q0 11-2.5 25.5T910-439L794-171q-9 21-29.5 36T721-120H314q-25 0-42.5-17.5T254-180v-428q0-11 4.5-22t12.5-19l207-218q14-14 33.5-17t36.5 7q17 10 25.5 28t4.5 37l-38 180h320ZM137-120q-23 0-40-17t-17-40v-398q0-23 17-40t40-17q23 0 40 17t17 40v398q0 23-17 40t-40 17Z"/></svg>
    </div>
    <div id="cta"></div>
    <div id="lock"><img class="m" src="mark.svg"><img class="wm" src="wordline.svg"></div>
  </div>
  <script>
  (function () {
    const PLAN = /*PLAN*/null;
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const $ = (s) => document.querySelector(s);
    const seed = (a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const word = (w, hot) => {
      const s = document.createElement('span'); s.className = 'w' + (hot ? ' hot' : '');
      const g = document.createElement('span'); g.className = 'g';
      const t = document.createElement('span'); t.className = 't'; t.textContent = w;
      g.appendChild(t); s.appendChild(g); return s;
    };
    const T = PLAN.drop;

    // Hook: the strongest line first, words building up line by line, a page at a time.
    const hook = $('#hook'), pages = [];
    PLAN.hook.lines.forEach((line) => {
      if (!pages[line.page]) { const pg = document.createElement('div'); pg.className = 'pg'; hook.appendChild(pg); pages[line.page] = pg; }
      const row = document.createElement('div'); row.className = 'hl' + (line.hot ? ' hot' : '');
      line.words.forEach((x) => {
        const s = word(x.w, line.hot); row.appendChild(s);
        tl.fromTo(s, { opacity: 0, x: -40, filter: 'blur(4px)', scale: line.hot ? 1.3 : 1 },
          { opacity: 1, x: 0, filter: 'blur(0px)', scale: 1, duration: line.hot ? 0.13 : 0.09,
            ease: line.hot ? 'back.out(2.4)' : 'power3.out' }, Math.max(0.02, x.t - 0.04));
      });
      pages[line.page].appendChild(row);
    });
    hook.querySelectorAll('.hl').forEach((row) => {
      let fs = parseFloat(getComputedStyle(row.querySelector('.t')).fontSize);
      while (row.scrollWidth > 930 && fs > 52) { fs -= 4; row.querySelectorAll('.t').forEach((w) => { w.style.fontSize = fs + 'px'; }); }
    });
    pages.forEach((pg, k) => {
      const first = PLAN.hook.lines.find((l) => l.page === k).words[0].t;
      const next = pages[k + 1] ? PLAN.hook.lines.find((l) => l.page === k + 1).words[0].t : null;
      tl.set(pg, { opacity: 1 }, Math.max(0, first - 0.05));
      if (next !== null) tl.set(pg, { opacity: 0 }, next - 0.05);
    });
    tl.to(hook, { opacity: 0, scale: 1.25, filter: 'blur(14px)', duration: 0.14, ease: 'power2.in' }, T - 0.14);

    // Captions: one group at a time, each word popping in as it is said.
    const caps = $('#caps');
    PLAN.groups.forEach((g) => {
      const box = document.createElement('div'); box.className = 'cap';
      g.words.forEach((x) => {
        const s = word(x.w, x.hot); box.appendChild(s);
        tl.fromTo(s, { opacity: 0, scale: x.hot ? 1.4 : 0.75, y: x.hot ? 0 : 18, rotation: x.hot ? -4 : 0, filter: 'blur(2px)' },
          { opacity: 1, scale: 1, y: 0, rotation: 0, filter: 'blur(0px)', duration: x.hot ? 0.13 : 0.08,
            ease: x.hot ? 'back.out(3)' : 'back.out(2)' }, x.t - 0.03);
      });
      caps.appendChild(box);
      let k = 1;
      while (box.scrollWidth > 940 && k > 0.62) {
        k -= 0.04;
        box.querySelectorAll('.t').forEach((t) => { t.style.fontSize = Math.round((t.closest('.hot') ? 120 : 92) * k) + 'px'; });
      }
      tl.set(box, { opacity: 1 }, g.start - 0.03);
      tl.set(box, { opacity: 0 }, g.end);
    });

    // Camera. Lens: the zoom-out reveal at 0 and the zoom-blur into the drop.
    tl.fromTo('#lens', { scale: 1.9, filter: 'blur(18px)' }, { scale: 1, filter: 'blur(0px)', duration: 0.55, ease: 'expo.out' }, 0);
    tl.to('#lens', { scale: 1.4, filter: 'blur(12px)', duration: 0.14, ease: 'power2.in' }, T - 0.14);
    tl.set('#lens', { scale: 1, filter: 'blur(0px)' }, T);
    PLAN.pulses.forEach((p) => {
      tl.fromTo('#pulse', { scale: p.from }, { scale: 1, duration: p.hold, ease: 'power2.out', immediateRender: false }, p.t);
    });
    PLAN.shakes.forEach((t0, k) => {
      const r = seed(1000 + k); let t = t0;
      for (let i = 0; i < 9; i++) {
        const a = 26 * Math.pow(0.72, i);
        tl.to('#shake', { x: (r() * 2 - 1) * a, y: (r() * 2 - 1) * a, rotation: (r() * 2 - 1) * a * 0.04, duration: 0.04, ease: 'none' }, t);
        t += 0.04;
      }
      tl.to('#shake', { x: 0, y: 0, rotation: 0, duration: 0.08 }, t);
    });

    // Tone: an old-film wash over a "back in the day" line.
    PLAN.tones.forEach((x) => {
      tl.fromTo('#tone', { opacity: 0 }, { opacity: 0.85, duration: 0.08, ease: 'none', immediateRender: false }, x.t);
      tl.to('#tone', { opacity: 0, duration: 0.1, ease: 'none' }, x.t + x.dur - 0.1);
    });

    // Cutaways: a generated image full frame, zooming in from blur and pulling back slowly.
    const cuts = $('#cuts');
    PLAN.inserts.forEach((x) => {
      const box = document.createElement('div'); box.className = 'cut';
      const img = document.createElement('img'); img.src = x.src; box.appendChild(img); cuts.appendChild(box);
      tl.set(box, { opacity: 1 }, x.t);
      tl.fromTo(img, { scale: 1.35, filter: 'blur(16px)' }, { scale: 1.14, filter: 'blur(0px)', duration: 0.2, ease: 'expo.out' }, x.t);
      tl.to(img, { scale: 1.0, duration: x.dur - 0.2, ease: 'power1.out' }, x.t + 0.2);
      tl.set(box, { opacity: 0 }, x.t + x.dur);
    });
    PLAN.flashes.forEach((f) => {
      tl.fromTo('#flash', { opacity: f.peak }, { opacity: 0, duration: f.decay, ease: 'power2.out', immediateRender: false }, f.t);
    });
    PLAN.leaks.forEach((t0) => {
      tl.fromTo('#leak', { opacity: 0, x: -160 }, { opacity: 0.85, x: 40, duration: 0.35, ease: 'power2.out', immediateRender: false }, t0);
      tl.to('#leak', { opacity: 0, x: 160, duration: 0.9, ease: 'power1.in' }, t0 + 0.35);
    });

    // Stickers: an emoji or a generated icon pops in above the speaker, floats, pops out.
    const stk = $('#stickers');
    PLAN.stickers.forEach((s, i) => {
      const img = document.createElement('img'); img.className = 'stk'; img.src = s.src;
      img.style.left = s.x + 'px'; img.style.top = s.y + 'px'; stk.appendChild(img);
      tl.fromTo(img, { opacity: 0, scale: 0, rotation: i % 2 ? 28 : -28, y: 50 },
        { opacity: 1, scale: 1, rotation: 0, y: 0, duration: 0.32, ease: 'back.out(2.4)' }, s.t);
      tl.to(img, { y: -24, rotation: i % 2 ? -5 : 5, duration: s.hold - 0.5, ease: 'sine.inOut' }, s.t + 0.32);
      tl.to(img, { opacity: 0, scale: 0.2, rotation: i % 2 ? -20 : 20, duration: 0.16, ease: 'power2.in' }, s.t + s.hold - 0.16);
    });

    // Embers: drawn from time alone, so any frame renders the same when seeked.
    const cv = $('#embers'), cx = cv.getContext('2d'), rnd = seed(7), P = [];
    for (let i = 0; i < 54; i++) P.push({ x: rnd() * 1080, y: rnd() * 2200, v: 50 + rnd() * 120, a: 8 + rnd() * 36,
      f: 0.3 + rnd() * 1.1, p: rnd() * 6.28, r: 1.4 + rnd() * 3.6, c: rnd() < 0.6 ? '255,158,44' : '249,200,53' });
    const ember = { t: 0 };
    const draw = () => {
      const t = ember.t, on = t < T ? 0.35 : 1; cx.clearRect(0, 0, 1080, 1920);
      for (const q of P) {
        const y = ((q.y - q.v * t) % 2200 + 2200) % 2200 - 140, x = q.x + Math.sin(t * q.f + q.p) * q.a;
        const fl = 0.45 + 0.55 * Math.abs(Math.sin(t * q.f * 3 + q.p));
        cx.globalAlpha = 0.85 * fl * on; cx.fillStyle = 'rgb(' + q.c + ')';
        cx.shadowColor = 'rgba(' + q.c + ',0.9)'; cx.shadowBlur = 12;
        cx.beginPath(); cx.arc(x, y, q.r, 0, 6.2832); cx.fill();
      }
    };
    tl.to(ember, { t: PLAN.duration, duration: PLAN.duration, ease: 'none', onUpdate: draw }, 0);

    // End card.
    if (PLAN.end) {
      const E = PLAN.end.t, ecv = $('#endfield'), ectx = ecv.getContext('2d');
      const FIELD = { color: '#1E2BE6', edge: '#ED4BA0', bg: '#05071E', density: 0.65, motion: 82, phase: 40 };
      const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
      const aur = (fx, fy, t, sp) => { const a = Math.sin(fx * 5 + t * sp * 0.9); const b = Math.sin(fy * 4.2 - t * sp * 0.7 + a * 1.5);
        const c = Math.sin((fx + fy) * 3.4 + t * sp * 1.2); return (a + b + c) / 2.4; };
      const fieldAt = { t: 0 };
      const paint = () => {  // the same maths as the title card (packages/brand Animation, "aurora"), drawn from time alone
        const m = FIELD.motion / 100, sp = 0.4 + m * 1.8, amp = 0.1 + m * 0.32, t = FIELD.phase + fieldAt.t;
        ectx.fillStyle = FIELD.bg; ectx.fillRect(0, 0, 540, 960);
        for (let j = 0; j < 960; j++) for (let i = 0; i < 540; i++) {
          const thr = BAYER[(j & 3) * 4 + (i & 3)];
          if (FIELD.density + aur(i / 539 * 0.5625, j / 959, t, sp) * amp > thr) { ectx.fillStyle = thr > 0.62 ? FIELD.edge : FIELD.color; ectx.fillRect(i, j, 1, 1); }
        }
      };
      const cta = $('#cta');
      [['LIKE AND', false], ['FOLLOW', false], ['FOR MORE', true]].forEach(([text, hot], k) => {
        const s = word(text, hot); cta.appendChild(s);
        tl.fromTo(s, { opacity: 0, scale: hot ? 1.4 : 0.75, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.16, ease: 'back.out(2.4)' }, E + 0.28 + k * 0.14);
      });
      tl.set('#end', { opacity: 1 }, E);
      tl.fromTo('#endfield', { scale: 1.15 }, { scale: 1, duration: 0.5, ease: 'expo.out', immediateRender: false }, E);
      tl.to(fieldAt, { t: PLAN.end.dur, duration: PLAN.end.dur, ease: 'none', onUpdate: paint }, E);
      tl.fromTo('#like', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.24, ease: 'back.out(2.2)' }, E + 0.12);
      const press = E + PLAN.end.press;
      tl.to('#like', { scale: 0.9, duration: 0.07, ease: 'power2.in' }, press - 0.07);
      tl.set('#thumbOut', { opacity: 0 }, press);
      tl.set('#thumbFill', { opacity: 1 }, press);
      tl.to('#like', { scale: 1.12, duration: 0.1, ease: 'power2.out' }, press);
      tl.to('#like', { scale: 1, duration: 0.25, ease: 'back.out(3)' }, press + 0.1);
      tl.fromTo('#like .burst', { opacity: 1, scale: 0.7 }, { opacity: 0, scale: 1.25, duration: 0.45, ease: 'power2.out', immediateRender: false }, press);
      tl.fromTo('#lock', { opacity: 0, y: 20 }, { opacity: 0.95, y: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, E + 0.6);
    }

    window.__timelines['short'] = tl;
  })();
  </script>
</div>
</body>
</html>
