<!doctype html>
<html><head><meta charset="utf-8">
<title>loading</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=block" rel="stylesheet">
<style>
/* Rendered by talk_clip.py with a transparent background. Two modes:
   "frame": the 1080x1920 overlay of a vertical clip. The hook band and the
   name band are opaque; the middle is left clear for the video.
   "captions": one 1080x200 row per caption, stacked, cut apart by ffmpeg. */
:root { --blue: #1e2be6; --navy: #05071e; --yellow: #f9c835; --white: #f4f5ff; --muted: #a4a7c8; }
html, body { margin: 0; background: transparent; }
body { width: 1080px; font-family: Manrope, sans-serif; color: var(--white); }
.hook { position: absolute; left: 0; top: 0; width: 1080px; height: 300px; box-sizing: border-box;
        background: var(--blue); display: flex; flex-direction: column; justify-content: center;
        padding: 0 64px; }
.hook div { font: 800 86px/1.04 Manrope, sans-serif; letter-spacing: -0.03em; white-space: nowrap; }
.hook div + div { color: var(--yellow); }
.name { position: absolute; left: 0; top: 1720px; width: 1080px; height: 200px; box-sizing: border-box;
        background: var(--navy); display: flex; flex-direction: column; justify-content: center; padding: 0 64px; gap: 6px; }
.name b { font: 800 50px/1.1 Manrope, sans-serif; letter-spacing: -0.01em; }
.name span { font: 600 32px/1.2 Manrope, sans-serif; color: var(--muted); }
.cap { width: 1080px; height: 200px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 0 60px; }
.cap span { font: 800 66px/1.1 Manrope, sans-serif; text-align: center; letter-spacing: -0.01em;
            -webkit-text-stroke: 12px var(--navy); paint-order: stroke fill; }
</style></head>
<body>
<script>
const CFG = /*CFG*/null;
(async () => {
  try {
    if (CFG.mode === 'frame') {
      const hook = document.createElement('section'); hook.className = 'hook';
      CFG.hook.forEach(line => { const d = document.createElement('div'); d.textContent = line; hook.appendChild(d); });
      const name = document.createElement('section'); name.className = 'name';
      const b = document.createElement('b'); b.textContent = CFG.speaker;
      const s = document.createElement('span'); s.textContent = CFG.line;
      name.append(b, s); document.body.append(hook, name);
      document.body.style.height = '1920px';
    } else {
      CFG.captions.forEach(text => {
        const row = document.createElement('div'); row.className = 'cap';
        const s = document.createElement('span'); s.textContent = text; row.appendChild(s);
        document.body.appendChild(row);
      });
    }
    await document.fonts.ready;
    if (!document.fonts.check('800 20px Manrope')) throw new Error('the fonts did not load');
    // Shrink a hook line that would run past the band.
    document.querySelectorAll('.hook div').forEach(d => {
      let fs = 86;
      while (d.scrollWidth > 952 && fs > 48) d.style.fontSize = (fs -= 2) + 'px';
    });
    document.title = 'ready';
  } catch (e) {
    document.title = 'error ' + e.message;
  }
})();
</script>
</body></html>
