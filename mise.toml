# Pinned tools and the tasks everyone (and CI) runs. `mise install`, then
# `mise run <task>`; `mise tasks` lists them.
[tools]
python = "3.12"
gitleaks = "8.30.1"
"pipx:yt-dlp" = "2026.10.26"

[tasks.fitness]
description = "Repository fitness checks (docs/adr/0002)"
run = "python3 scripts/fitness.py"

[tasks.secrets]
description = "gitleaks over the full history"
run = "gitleaks git . --redact --no-banner"

[tasks.bench]
description = "Transcription benchmark (docs: scripts/bench_transcription.py)"
run = "python3 scripts/bench_transcription.py"
